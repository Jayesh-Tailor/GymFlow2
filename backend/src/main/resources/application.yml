spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gymflow}
    username: 
    password: 
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
server:
  error:
    include-message: never
